[project]
name = "airut-proxy"
version = "0.0.0"
description = "Dependency lockfile for the Airut proxy container"
requires-python = ">=3.13"
dependencies = [
    "mitmproxy",
    "cryptography",
    "graphql-core",
]

[tool.uv]
# Raise floors on transitive dependencies to fix known vulnerabilities that
# mitmproxy's own pins exclude or do not rule out. Remove each entry when
# mitmproxy releases a version whose own pins already admit the fixed release.
#
# - tornado >=6.6: fixes GHSA-pcg2-g6cj-q92c (quadratic header parsing on
#   obs-fold continuation lines), GHSA-r4j5-9xpp-3985 (tiny chunked-body
#   chunks block the event loop) and GHSA-pw9p-v7r6-gx4p (RedirectHandler open
#   redirect). mitmproxy 12.3.1 pins tornado <=6.5.10, so the override crosses
#   a minor version. mitmproxy imports tornado only in mitmweb and the console
#   UI (mitmproxy/tools/web, mitmproxy/tools/console), never from mitmdump,
#   which is what the proxy container runs: a running mitmdump with the proxy
#   filter addons loaded has no tornado in sys.modules, so the 6.6 breaking
#   changes (header line folding removal, lock/queue timeout=0 semantics,
#   dropped WebSocket v7/8) do not reach the proxy.
# - pyasn1 >=0.6.3: fixes GHSA-jr27-m4p2-rc6r. pyasn1 comes in via ldap3
#   (pyasn1>=0.4.6), not a mitmproxy pin, so this floor keeps vulnerable
#   releases out of the resolution.
override-dependencies = [
    "tornado>=6.6",
    "pyasn1>=0.6.3",
]
